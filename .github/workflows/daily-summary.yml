name: Daily Horizon Summary

on:
  schedule:
    # 00:00 UTC = 北京时间 08:00; 12:00 UTC = 北京时间 20:00
    - cron: '0 0,12 * * *'
  workflow_dispatch:      # 允许手动触发运行

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要提交与发布权限

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon --hours 12

      - name: Distinguish Morning and Evening Summaries
        run: |
          HOUR=$(TZ="Asia/Shanghai" date +%H)
          if [ "$HOUR" -lt "12" ]; then
            TAG="morning"
          else
            TAG="evening"
          fi
          
          DATE_STR=$(date +%Y-%m-%d)
          
          # 重命名 docs/_posts 下生成的静态 Markdown 网页
          if [ -f "docs/_posts/${DATE_STR}-summary-zh.md" ]; then
            mv "docs/_posts/${DATE_STR}-summary-zh.md" "docs/_posts/${DATE_STR}-${TAG}-summary-zh.md"
          fi
          
          # 重命名 data/summaries 下的数据文件
          if [ -f "data/summaries/horizon-${DATE_STR}-zh.md" ]; then
            mv "data/summaries/horizon-${DATE_STR}-zh.md" "data/summaries/horizon-${DATE_STR}-${TAG}-zh.md"
          fi

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # 保持 gh-pages 分支上的历史简报不被清空
          commit_message: "Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
